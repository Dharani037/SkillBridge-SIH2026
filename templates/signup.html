<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | SkillBridge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">

    <div class="auth-container">

        <div class="auth-brand">

            <a href="{{ url_for('home') }}" class="logo">
                Skill<span>Bridge</span>
            </a>

            <p>
                Academia–Industry Collaboration Platform
            </p>

        </div>


        <div class="auth-card">

            <div class="auth-heading">

                <h1>Create Your Account</h1>

                <p>
                    Join SkillBridge and start building your career.
                </p>

            </div>


            <form method="POST"
                  action="{{ url_for('signup') }}">

                <div class="form-group">

                    <label for="full_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="role">
                        Register As
                    </label>

                    <select
                        id="role"
                        name="role"
                        required
                    >

                        <option value="">
                            Select your role
                        </option>

                        <option value="student">
                            Student
                        </option>

                        <option value="company">
                            Industry / Company
                        </option>

                        <option value="college">
                            College / Faculty
                        </option>

                    </select>

                </div>


                <button type="submit"
                        class="auth-btn">
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="{{ url_for('login') }}">
                        Login
                    </a>
                </p>

            </div>

        </div>


        <div class="back-home">

            <a href="{{ url_for('home') }}">
                ← Back to Home
            </a>

        </div>

    </div>


<script src="{{ url_for('static', filename='script.js') }}">
</script>

</body>
</html>
