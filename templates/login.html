<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SkillBridge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">

    <div class="auth-container">

        <div class="auth-brand">
            <a href="{{ url_for('home') }}" class="logo">
                Skill<span>Bridge</span>
            </a>

            <p>Academia–Industry Collaboration Platform</p>
        </div>


        <div class="auth-card">

            <div class="auth-heading">

                <h1>Welcome Back</h1>

                <p>
                    Login to continue your SkillBridge journey.
                </p>

            </div>


            <form method="POST"
                  action="{{ url_for('login') }}">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="role">
                        Login As
                    </label>

                    <select
                        id="role"
                        name="role"
                        required
                    >

                        <option value="">
                            Select your role
                        </option>

                        <option value="student">
                            Student
                        </option>

                        <option value="company">
                            Industry / Company
                        </option>

                        <option value="college">
                            College / Faculty
                        </option>

                    </select>

                </div>


                <button type="submit"
                        class="auth-btn">
                    Login
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="{{ url_for('signup') }}">
                        Create Account
                    </a>
                </p>

            </div>

        </div>


        <div class="back-home">

            <a href="{{ url_for('home') }}">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
